; encoder-odometry-firmware
;
;   pio run -e esp32dev              ESP32 DevKit, L298N drivers, PCNT encoders
;   pio run -e esp32-s3-devkitc-1    ESP32-S3 DevKitC-1, L298N drivers, PCNT encoders
;   pio run -e esp32dev_drv_isr      ESP32 DevKit, DRV-style (IN/IN PWM) drivers,
;                                    interrupt-driven software decoder
;   pio run -e nucleo_f401re         NUCLEO-F401RE, L298N drivers, timer encoder mode
;   pio test -e native               host unit tests (no hardware needed)

[platformio]
default_envs = esp32dev

[env]
; lib/odocore is C++17; the Arduino cores default to gnu++11 / gnu++14.
build_unflags = -std=gnu++11 -std=gnu++14
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra
monitor_speed = 921600

[esp32]
platform = espressif32@6.9.0
framework = arduino

[env:esp32dev]
extends = esp32
board = esp32dev
build_flags = ${env.build_flags} -D ODO_BOARD_ESP32DEV -D ODO_ENCODER_PCNT -D ODO_DRIVER_L298N

[env:esp32-s3-devkitc-1]
extends = esp32
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D ODO_BOARD_ESP32S3 -D ODO_ENCODER_PCNT -D ODO_DRIVER_L298N

[env:esp32dev_drv_isr]
extends = esp32
board = esp32dev
build_flags = ${env.build_flags} -D ODO_BOARD_ESP32DEV -D ODO_ENCODER_ISR -D ODO_DRIVER_DRV

[env:nucleo_f401re]
platform = ststm32@19.7.1
framework = arduino
board = nucleo_f401re
monitor_speed = 460800
; A frame is up to ~72 bytes: give the UART a TX buffer that holds a burst.
build_flags = ${env.build_flags} -D ODO_BOARD_NUCLEO_F401RE -D ODO_ENCODER_STM32_TIMER
    -D ODO_DRIVER_L298N -D SERIAL_TX_BUFFER_SIZE=512

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -D UNITY_INCLUDE_DOUBLE
